<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" role="img" aria-label="IQBench 流程：计分主线与渠道鉴定">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14110d"/>
      <stop offset="1" stop-color="#241f18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8893a"/>
      <stop offset="1" stop-color="#e8c36a"/>
    </linearGradient>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".35" fill="#efe6d4" opacity=".06"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d4a24c"/>
    </marker>
    <marker id="arrDim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a7a5c"/>
    </marker>
  </defs>

  <rect width="1400" height="430" fill="url(#bg)"/>
  <rect width="1400" height="430" fill="url(#grain)"/>

  <text x="80" y="50" fill="#d4a24c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="5">PIPELINE / BENCH V7</text>
  <text x="1320" y="50" text-anchor="end" fill="#6f6759" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2">18 UNITS + 15 PROBES</text>

  <!-- lane 1: scored -->
  <text x="80" y="92" fill="#d4a24c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2">计分主线 · 进 IQ</text>

  <g font-family="Georgia, 'Noto Serif SC', serif">
    <g>
      <rect x="80" y="108" width="180" height="72" rx="12" fill="#1a1712" stroke="#3d352b" stroke-width="1.5"/>
      <text x="170" y="139" text-anchor="middle" fill="#f3efe4" font-size="16">填 Base URL + Key</text>
      <text x="170" y="164" text-anchor="middle" fill="#9a9183" font-size="12" font-family="ui-monospace, Menlo, monospace">仅本标签页 · 关页即清</text>
    </g>
    <line x1="264" y1="144" x2="285" y2="144" stroke="#d4a24c" stroke-width="2" marker-end="url(#arr)"/>
    <g>
      <rect x="292" y="108" width="180" height="72" rx="12" fill="#1a1712" stroke="#3d352b" stroke-width="1.5"/>
      <text x="382" y="139" text-anchor="middle" fill="#f3efe4" font-size="16">拉模型 · 勾选</text>
      <text x="382" y="164" text-anchor="middle" fill="#9a9183" font-size="12" font-family="ui-monospace, Menlo, monospace">1–4 路并行</text>
    </g>
    <line x1="476" y1="144" x2="497" y2="144" stroke="#d4a24c" stroke-width="2" marker-end="url(#arr)"/>
    <g>
      <rect x="504" y="108" width="180" height="72" rx="12" fill="#1a1712" stroke="#3d352b" stroke-width="1.5"/>
      <text x="594" y="139" text-anchor="middle" fill="#f3efe4" font-size="16">流式作答</text>
      <text x="594" y="164" text-anchor="middle" fill="#9a9183" font-size="12" font-family="ui-monospace, Menlo, monospace">xhigh · 4 次退避重试</text>
    </g>
    <line x1="688" y1="144" x2="709" y2="144" stroke="#d4a24c" stroke-width="2" marker-end="url(#arr)"/>
    <g>
      <rect x="716" y="108" width="180" height="72" rx="12" fill="#1a1712" stroke="#3d352b" stroke-width="1.5"/>
      <text x="806" y="139" text-anchor="middle" fill="#f3efe4" font-size="16">抽取最终答案</text>
      <text x="806" y="164" text-anchor="middle" fill="#9a9183" font-size="12" font-family="ui-monospace, Menlo, monospace">只认正文 · 不认思维链</text>
    </g>
    <line x1="900" y1="144" x2="921" y2="144" stroke="#d4a24c" stroke-width="2" marker-end="url(#arr)"/>
    <g>
      <rect x="928" y="108" width="180" height="72" rx="12" fill="#1a1712" stroke="#3d352b" stroke-width="1.5"/>
      <text x="1018" y="139" text-anchor="middle" fill="#f3efe4" font-size="16">判分 × 速度</text>
      <text x="1018" y="164" text-anchor="middle" fill="#9a9183" font-size="12" font-family="ui-monospace, Menlo, monospace">18 单元 · 卷面 163</text>
    </g>
    <line x1="1112" y1="144" x2="1133" y2="144" stroke="#d4a24c" stroke-width="2" marker-end="url(#arr)"/>
    <g>
      <rect x="1140" y="108" width="180" height="72" rx="12" fill="#1a1712" stroke="url(#gold)" stroke-width="2"/>
      <text x="1230" y="139" text-anchor="middle" fill="#e8c36a" font-size="16" font-weight="700">IQ · 报告 · 榜单</text>
      <text x="1230" y="164" text-anchor="middle" fill="#9a9183" font-size="12" font-family="ui-monospace, Menlo, monospace">55–145 · 95% 区间</text>
    </g>
  </g>

  <!-- connector -->
  <path d="M1230 184 C1230 222, 1150 230, 1030 230 L380 230 C315 230, 280 238, 280 268"
        fill="none" stroke="#8a7a5c" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrDim)"/>
  <text x="705" y="222" text-anchor="middle" fill="#8a7a5c" font-size="12" font-family="ui-monospace, Menlo, monospace">主线跑完 · 追加 15 探针</text>

  <!-- lane 2: probes, not scored -->
  <text x="80" y="262" fill="#c4b8a4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2">渠道鉴定 · 不计分</text>
  <text x="1320" y="262" text-anchor="end" fill="#6f6759" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">只打标签 · 不碰 IQ 与卷面</text>

  <g font-family="Georgia, 'Noto Serif SC', serif">
    <g>
      <rect x="80" y="278" width="265" height="72" rx="12" fill="#1a1712" stroke="#3d352b" stroke-width="1.5" stroke-dasharray="7 5"/>
      <text x="212" y="309" text-anchor="middle" fill="#f3efe4" font-size="16">知识阶梯 13 问</text>
      <text x="212" y="334" text-anchor="middle" fill="#9a9183" font-size="12" font-family="ui-monospace, Menlo, monospace">训练截止 ≈ 季度 · 顶格 2026Q3</text>
    </g>
    <line x1="349" y1="314" x2="397" y2="314" stroke="#8a7a5c" stroke-width="2" marker-end="url(#arrDim)"/>
    <g>
      <rect x="405" y="278" width="265" height="72" rx="12" fill="#1a1712" stroke="#3d352b" stroke-width="1.5" stroke-dasharray="7 5"/>
      <text x="537" y="309" text-anchor="middle" fill="#f3efe4" font-size="16">juice · 身份自报</text>
      <text x="537" y="334" text-anchor="middle" fill="#9a9183" font-size="12" font-family="ui-monospace, Menlo, monospace">Codex 反代指纹</text>
    </g>
    <line x1="674" y1="314" x2="722" y2="314" stroke="#8a7a5c" stroke-width="2" marker-end="url(#arrDim)"/>
    <g>
      <rect x="730" y="278" width="265" height="72" rx="12" fill="#1a1712" stroke="#3d352b" stroke-width="1.5" stroke-dasharray="7 5"/>
      <text x="862" y="309" text-anchor="middle" fill="#f3efe4" font-size="16">全网降智对照</text>
      <text x="862" y="334" text-anchor="middle" fill="#9a9183" font-size="12" font-family="ui-monospace, Menlo, monospace">低于中位 12 分才指认</text>
    </g>
    <line x1="999" y1="314" x2="1047" y2="314" stroke="#8a7a5c" stroke-width="2" marker-end="url(#arrDim)"/>
    <g>
      <rect x="1055" y="278" width="265" height="72" rx="12" fill="#241a10" stroke="#b8893a" stroke-width="1.5"/>
      <text x="1187" y="309" text-anchor="middle" fill="#e8c36a" font-size="16">标签进榜单</text>
      <text x="1187" y="334" text-anchor="middle" fill="#c4b8a4" font-size="12" font-family="ui-monospace, Menlo, monospace">⚠ 联网 · juice · 降智</text>
    </g>
  </g>

  <path d="M0 400 C 220 384, 380 408, 640 394 C 900 380, 1100 406, 1400 390 V430 H0 Z" fill="#1a1712"/>
</svg>
