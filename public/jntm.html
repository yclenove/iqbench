<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鸡你太美 · 鹈鹕骑自行车</title>
  <style>
    /*
     * 设计说明：
     * 1. 全部动画由 CSS keyframes 驱动，时间基准统一收敛到 --beat（一拍时长）与 --wheel（车轮一圈）。
     *    切换速度时只改这两个变量，避免几十处 duration 散落各处、改一处漏一处。
     * 2. 需要自转的元素一律采用「外层 g 负责定位 + 内层图形以 (0,0) 为中心 + transform-origin: 0 0」，
     *    这样不依赖 transform-box: fill-box 的浏览器差异，Safari / Firefox 表现一致。
     * 3. 尊重 prefers-reduced-motion：前庭敏感用户关闭全部动画，画面仍是一张完整静帧。
     */
    :root {
      --beat: 0.46s;   /* 一拍 ≈ 130 BPM */
      --wheel: 0.9s;   /* 车轮一圈 */
      --ink: #f3e9ff;
    }

    /* 三档速度：由页面按钮切换 data-tempo，只覆盖节拍变量 */
    :root[data-tempo="slow"] { --beat: 0.72s; --wheel: 1.5s; }
    :root[data-tempo="fast"] { --beat: 0.30s; --wheel: 0.55s; }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 28px 16px;
      background:
        radial-gradient(900px 420px at 50% 0%, #3a1d63 0%, transparent 60%),
        linear-gradient(180deg, #180b2c 0%, #0b0616 100%);
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
      color: var(--ink);
    }

    h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-shadow: 0 0 18px rgba(255, 92, 240, 0.55);
    }

    .subtitle { margin: 0; font-size: 13px; color: #b8a6d6; letter-spacing: 0.06em; }

    .stage {
      width: min(980px, 100%);
      border-radius: 26px;
      overflow: hidden;
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(255, 255, 255, 0.08) inset;
    }

    svg { display: block; width: 100%; height: auto; }

    .controls { display: flex; gap: 10px; }

    .controls button {
      padding: 7px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.06);
      color: var(--ink);
      font-size: 13px;
      font-family: inherit;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .controls button:hover { background: rgba(255, 255, 255, 0.14); }
    .controls button[aria-pressed="true"] {
      background: linear-gradient(180deg, #ff5cf0, #a24bff);
      border-color: transparent;
      color: #fff;
      font-weight: 700;
    }

    /* ---------- 舞台环境 ---------- */
    /* 聚光灯左右扫动，两束相位相反，制造舞台追光的交错感 */
    .beam-l { animation: sweepL calc(var(--beat) * 8) ease-in-out infinite; transform-origin: 0 0; }
    .beam-r { animation: sweepR calc(var(--beat) * 8) ease-in-out infinite; transform-origin: 0 0; }

    /* LED 音柱：同一条 keyframes，用 delay 错开成波浪 */
    .bar { animation: pump calc(var(--beat) * 2) ease-in-out infinite; transform-origin: 0 0; }

    .glowdot { animation: twinkle calc(var(--beat) * 3) ease-in-out infinite; }
    .stick { animation: wave calc(var(--beat) * 2) ease-in-out infinite; transform-origin: 0 0; }

    /* ---------- 骑行主体 ---------- */
    .spin { animation: spin var(--wheel) linear infinite; transform-origin: 0 0; }
    /* 整体律动：两拍一个来回，带极轻微倾斜，避免纯上下显得僵硬 */
    .groove { animation: groove calc(var(--beat) * 2) ease-in-out infinite; }
    .head-bop { animation: headBop calc(var(--beat) * 2) ease-in-out infinite; transform-origin: 492px 128px; }
    .arm-up { animation: armUp calc(var(--beat) * 4) ease-in-out infinite; transform-origin: 444px 170px; }
    .ball-spin { animation: spin calc(var(--beat) * 1.5) linear infinite; transform-origin: 0 0; }
    .pouch { animation: wobble calc(var(--beat) * 3) ease-in-out infinite; transform-origin: 505px 119px; }
    .hair { animation: hairFlick calc(var(--beat) * 2) ease-in-out infinite; transform-origin: 508px 80px; }

    /* ---------- 前景特效 ---------- */
    .note { animation: floatUp calc(var(--beat) * 9) linear infinite; opacity: 0; }
    .confetti { animation: fall calc(var(--beat) * 12) linear infinite; opacity: 0; }
    .title-pulse { animation: titlePulse calc(var(--beat) * 4) ease-in-out infinite; transform-origin: 46px 96px; }
    /* 四个标签轮流点亮，四拍一循环，正好对上「唱 跳 rap 篮球」 */
    .tag { animation: tagFlash calc(var(--beat) * 4) steps(1, end) infinite; }
    .bubble { animation: bubblePop calc(var(--beat) * 8) ease-in-out infinite; transform-origin: 800px 128px; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes groove {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-9px) rotate(-1.2deg); }
    }
    /* 头放大到 Q 版比例后，同样的角度看起来会晃得过猛，这里收窄摆幅 */
    @keyframes headBop {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50%      { transform: translateY(3px) rotate(2.5deg); }
    }
    @keyframes armUp {
      0%, 100% { transform: rotate(-4deg) translateY(0); }
      50%      { transform: rotate(6deg) translateY(-6px); }
    }
    @keyframes hairFlick {
      0%, 100% { transform: rotate(-4deg); }
      50%      { transform: rotate(3deg); }
    }
    @keyframes wobble {
      0%, 100% { transform: rotate(-2.5deg); }
      50%      { transform: rotate(3.5deg); }
    }
    @keyframes sweepL {
      0%, 100% { transform: rotate(-11deg); }
      50%      { transform: rotate(9deg); }
    }
    @keyframes sweepR {
      0%, 100% { transform: rotate(10deg); }
      50%      { transform: rotate(-10deg); }
    }
    @keyframes pump {
      0%, 100% { transform: scaleY(0.35); }
      50%      { transform: scaleY(1); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.25; }
      50%      { opacity: 1; }
    }
    @keyframes wave {
      0%, 100% { transform: rotate(-16deg); }
      50%      { transform: rotate(16deg); }
    }
    @keyframes floatUp {
      0%   { opacity: 0; transform: translate(0, 0) rotate(-8deg); }
      12%  { opacity: 0.95; }
      80%  { opacity: 0.7; }
      100% { opacity: 0; transform: translate(46px, -230px) rotate(16deg); }
    }
    @keyframes fall {
      0%   { opacity: 0; transform: translate(0, -40px) rotate(0deg); }
      10%  { opacity: 1; }
      85%  { opacity: 0.9; }
      100% { opacity: 0; transform: translate(-70px, 520px) rotate(520deg); }
    }
    @keyframes titlePulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.045); }
    }
    /* steps(1) 让四个标签是「跳变点亮」而不是渐变，节奏感更强 */
    @keyframes tagFlash {
      0%, 25%  { opacity: 1; }
      25.01%, 100% { opacity: 0.3; }
    }
    @keyframes bubblePop {
      0%, 8%   { opacity: 0; transform: scale(0.6); }
      14%      { opacity: 1; transform: scale(1.08); }
      18%, 40% { opacity: 1; transform: scale(1); }
      48%, 100%{ opacity: 0; transform: scale(0.9); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .note, .confetti, .bubble { opacity: 0.85; }
    }
  </style>
</head>
<body>
  <h1>鸡 你 太 美</h1>

  <div class="stage">
    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc">
      <title id="ttl">鸡你大舞台，有胆你就来</title>
      <desc id="dsc">紫色舞台聚光灯下，一只留着中分卷发、穿白衬衫黑背带的鹈鹕坐在自行车上，一只翅膀单手转着篮球，喉袋里还兜着一颗球，随节拍上下律动。</desc>

      <defs>
        <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#2a0f4d" />
          <stop offset="55%"  stop-color="#421a6b" />
          <stop offset="100%" stop-color="#180a2e" />
        </linearGradient>
        <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#3b1f5e" />
          <stop offset="45%"  stop-color="#241141" />
          <stop offset="100%" stop-color="#12081f" />
        </linearGradient>
        <linearGradient id="beamPink" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#ff7ef0" stop-opacity="0.85" />
          <stop offset="100%" stop-color="#ff7ef0" stop-opacity="0" />
        </linearGradient>
        <linearGradient id="beamCyan" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#66e6ff" stop-opacity="0.85" />
          <stop offset="100%" stop-color="#66e6ff" stop-opacity="0" />
        </linearGradient>
        <linearGradient id="bodyFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#fffdf8" />
          <stop offset="100%" stop-color="#e8ddf0" />
        </linearGradient>
        <linearGradient id="wingFill" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%"   stop-color="#fbf7ff" />
          <stop offset="72%"  stop-color="#ddd2ea" />
          <stop offset="100%" stop-color="#4a3f5e" />
        </linearGradient>
        <linearGradient id="billFill" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="#ffd35c" />
          <stop offset="100%" stop-color="#f09318" />
        </linearGradient>
        <linearGradient id="pouchFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#ffb08a" />
          <stop offset="100%" stop-color="#e0684f" />
        </linearGradient>
        <linearGradient id="frameFill" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%"   stop-color="#00e0d1" />
          <stop offset="100%" stop-color="#7b4bff" />
        </linearGradient>
        <linearGradient id="titleFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#fff6a8" />
          <stop offset="55%"  stop-color="#ff7ae0" />
          <stop offset="100%" stop-color="#8f5cff" />
        </linearGradient>
        <radialGradient id="ballFill" cx="35%" cy="30%" r="75%">
          <stop offset="0%"   stop-color="#ffbe6b" />
          <stop offset="60%"  stop-color="#f0821f" />
          <stop offset="100%" stop-color="#c9530b" />
        </radialGradient>
        <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#fff" stop-opacity="0.5" />
          <stop offset="100%" stop-color="#fff" stop-opacity="0" />
        </linearGradient>

        <!-- 灰格纹西裤的面料：两组疏密不同的格线叠出千鸟格那种细密质感 -->
        <pattern id="checkPants" width="12" height="12" patternUnits="userSpaceOnUse">
          <rect width="12" height="12" fill="#bdb8af" />
          <path d="M0 0 H12 M0 6 H12 M0 0 V12 M6 0 V12" stroke="#a19b90" stroke-width="1.1" />
          <path d="M0 3 H12 M3 0 V12" stroke="#d2cdc4" stroke-width="0.8" />
        </pattern>

        <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="7" result="b" />
          <feMerge>
            <feMergeNode in="b" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
        <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
          <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#0b0616" flood-opacity="0.45" />
        </filter>
        <filter id="blurRef" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="3.5" />
        </filter>

        <!-- 地面倒影用的渐隐遮罩：越往下越淡 -->
        <mask id="reflectMask">
          <rect x="0" y="482" width="960" height="118" fill="url(#fade)" />
        </mask>

        <!-- 骑行主体定义一次，实体与倒影各引用一次，保证两者动作完全同步 -->
        <g id="rider">
          <!-- 后轮 -->
          <g transform="translate(290 400)">
            <g class="spin">
              <circle r="70" fill="none" stroke="#241a3a" stroke-width="11" />
              <circle r="70" fill="none" stroke="#7b4bff" stroke-width="2.5" opacity="0.9" />
              <circle r="57" fill="none" stroke="#00e0d1" stroke-width="1.6" opacity="0.55" />
              <g stroke="#8de9ff" stroke-width="2" opacity="0.75">
                <line x1="0" y1="-57" x2="0" y2="57" />
                <line x1="-57" y1="0" x2="57" y2="0" />
                <line x1="-40" y1="-40" x2="40" y2="40" />
                <line x1="40" y1="-40" x2="-40" y2="40" />
                <line x1="-22" y1="-53" x2="22" y2="53" />
                <line x1="53" y1="-22" x2="-53" y2="22" />
              </g>
              <circle r="9" fill="#ffd35c" stroke="#241a3a" stroke-width="3" />
            </g>
          </g>

          <!-- 前轮 -->
          <g transform="translate(620 400)">
            <g class="spin">
              <circle r="70" fill="none" stroke="#241a3a" stroke-width="11" />
              <circle r="70" fill="none" stroke="#7b4bff" stroke-width="2.5" opacity="0.9" />
              <circle r="57" fill="none" stroke="#00e0d1" stroke-width="1.6" opacity="0.55" />
              <g stroke="#8de9ff" stroke-width="2" opacity="0.75">
                <line x1="0" y1="-57" x2="0" y2="57" />
                <line x1="-57" y1="0" x2="57" y2="0" />
                <line x1="-40" y1="-40" x2="40" y2="40" />
                <line x1="40" y1="-40" x2="-40" y2="40" />
                <line x1="-22" y1="-53" x2="22" y2="53" />
                <line x1="53" y1="-22" x2="-53" y2="22" />
              </g>
              <circle r="9" fill="#ffd35c" stroke="#241a3a" stroke-width="3" />
            </g>
          </g>

          <!-- 车架 -->
          <g fill="none" stroke="url(#frameFill)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
            <path d="M290 400 L 430 400" />
            <path d="M290 400 L 352 286" />
            <path d="M352 278 L 430 400" />
            <path d="M430 400 L 562 278" />
            <path d="M360 292 L 552 284" />
            <path d="M620 400 L 562 268" />
          </g>
          <path d="M430 416 C 500 430 560 418 610 400" fill="none" stroke="#8de9ff" stroke-width="3" stroke-dasharray="5 4" opacity="0.8" />
          <circle cx="430" cy="400" r="16" fill="#241a3a" />
          <circle cx="430" cy="400" r="9" fill="#ffd35c" />

          <!-- 曲柄与脚踏：固定在骑行姿势，蹼足踩实 -->
          <g>
            <line x1="430" y1="400" x2="478" y2="418" stroke="#241a3a" stroke-width="7" stroke-linecap="round" />
            <line x1="430" y1="400" x2="386" y2="378" stroke="#241a3a" stroke-width="7" stroke-linecap="round" />
            <rect x="470" y="412" width="28" height="11" rx="3" fill="#ffd35c" stroke="#241a3a" stroke-width="2" />
            <rect x="362" y="372" width="28" height="11" rx="3" fill="#ffd35c" stroke="#241a3a" stroke-width="2" />
          </g>

          <!-- 车座 -->
          <ellipse cx="348" cy="268" rx="34" ry="11" fill="#1c1430" />
          <path d="M318 266 Q 348 252 382 266" fill="#2f2350" />

          <!-- 车把 -->
          <path d="M562 268 L 562 248" stroke="#241a3a" stroke-width="8" stroke-linecap="round" />
          <path d="M530 246 C 548 232 580 228 608 244" fill="none" stroke="#241a3a" stroke-width="8" stroke-linecap="round" />
          <path d="M530 246 C 524 250 522 258 528 262" fill="none" stroke="#ff4d9d" stroke-width="9" stroke-linecap="round" />
          <path d="M608 244 C 616 248 618 256 612 262" fill="none" stroke="#ff4d9d" stroke-width="9" stroke-linecap="round" />

          <!--
            ===== 鹈鹕本鹈：拟人化坐姿 =====
            鸟原本的水平体态无论怎么描都撑不起衣服，衬衫背带只会读成「白鸟身上绑了带子」，
            所以整体改成人一样坐在车座上：竖直躯干撑白衬衫与背带裤，翅膀当两条手臂
            （一只扶把、一只举球），鹈鹕特征全部保留在大喙、喉袋、蹼足和 S 形脖子上。
          -->
          <g class="groove" filter="url(#soft)">
            <!-- 尾羽：扇形一片，比拆成两片三角更像鸟尾，也不会读成白箭头 -->
            <path d="M354 248 C 328 244 304 253 288 272 C 300 285 322 289 344 282 C 353 276 357 261 354 248 Z"
                  fill="#f7f2fb" stroke="#cec3de" stroke-width="2" />
            <g fill="none" stroke="#cec3de" stroke-width="1.8" stroke-linecap="round">
              <path d="M348 254 C 330 257 314 265 300 276" />
              <path d="M347 268 C 333 271 319 277 307 283" />
            </g>

            <!-- 远侧腿：先画，让它压在躯干之后；整条压深表示在后 -->
            <g>
              <path d="M362 256 L 430 322" fill="none" stroke="url(#checkPants)" stroke-width="32" stroke-linecap="round" />
              <path d="M430 322 L 393 361" fill="none" stroke="url(#checkPants)" stroke-width="21" stroke-linecap="round" />
              <g opacity="0.3" stroke="#241f2e" fill="none" stroke-linecap="round">
                <path d="M362 256 L 430 322" stroke-width="32" />
                <path d="M430 322 L 393 361" stroke-width="21" />
              </g>
              <!-- 露踝：裤脚到踝上方，留一截鹈鹕自己的腿 -->
              <path d="M393 361 L 387 367" fill="none" stroke="#c9822a" stroke-width="15" stroke-linecap="round" />
              <path d="M368 358 C 363 366 363 372 366 378 L 392 378 C 396 374 394 367 388 363 L 380 355 Z"
                    fill="#17161e" stroke="#2f2c3a" stroke-width="2" />
            </g>

            <!-- 举球的手臂（远侧）+ 指尖旋转的篮球 -->
            <g class="arm-up">
              <path d="M444 170 C 428 152 414 130 406 108" fill="none" stroke="#3a3746" stroke-width="30" stroke-linecap="round" />
              <path d="M444 170 C 428 152 414 130 406 108" fill="none" stroke="#1b1a24" stroke-width="26" stroke-linecap="round" />
              <!-- 毛衣袖口 -->
              <path d="M411 136 L 433 148" fill="none" stroke="#474357" stroke-width="2.8" stroke-linecap="round" />
              <!-- 翼尖当手，托住球 -->
              <path d="M394 112 C 388 100 394 88 406 88 C 418 88 424 100 416 112 C 409 118 400 118 394 112 Z"
                    fill="url(#wingFill)" stroke="#b9abd0" stroke-width="2" />
              <!-- 球自身以 (0,0) 为中心，便于原地自转 -->
              <g transform="translate(406 74)">
                <g class="ball-spin">
                  <circle r="26" fill="url(#ballFill)" stroke="#8a3707" stroke-width="2.5" />
                  <g fill="none" stroke="#7d3206" stroke-width="2.4" stroke-linecap="round">
                    <line x1="0" y1="-26" x2="0" y2="26" />
                    <line x1="-26" y1="0" x2="26" y2="0" />
                    <path d="M-8 -24.8 C -18 -12, -18 12, -8 24.8" />
                    <path d="M8 -24.8 C 18 -12, 18 12, 8 24.8" />
                  </g>
                  <ellipse cx="-9" cy="-11" rx="7.5" ry="4.5" fill="#fff" opacity="0.28" transform="rotate(-30 -9 -11)" />
                </g>
              </g>
            </g>

            <!-- 躯干：黑色高领毛衣。倾斜的胶囊，下端落在车座上，上端就是肩 -->
            <ellipse cx="405" cy="210" rx="42" ry="68" transform="rotate(38 405 210)"
                     fill="#1b1a24" stroke="#3a3746" stroke-width="2" />
            <!-- 针织竖纹，顺着躯干轴向走 -->
            <g fill="none" stroke="#2c2a38" stroke-width="2.2" stroke-linecap="round">
              <path d="M424 160 C 408 180 394 200 382 216" />
              <path d="M438 176 C 422 196 408 214 396 230" />
              <path d="M450 194 C 436 212 422 228 412 240" />
            </g>

            <!-- 灰格纹西裤：臀腿一体，格纹用 pattern 铺 -->
            <ellipse cx="380" cy="246" rx="42" ry="34" transform="rotate(38 380 246)"
                     fill="url(#checkPants)" stroke="#928c82" stroke-width="2" />

            <!--
              米白背带：参考造型里背带是压在黑毛衣外面的两条浅色带子 + 腰口皮扣，
              不是黑色围兜，所以这里只留带子与扣件。
            -->
            <g fill="none" stroke-linecap="butt">
              <path d="M404 252 C 414 226 428 196 438 172 C 444 158 452 148 460 146" stroke="#e5ddc5" stroke-width="12" />
              <path d="M378 236 C 388 210 400 182 410 162 C 416 150 424 142 432 140" stroke="#d8cfb4" stroke-width="11" />
            </g>
            <g fill="none" stroke="#bfb192" stroke-width="1.4" opacity="0.9">
              <path d="M410 254 C 420 228 434 198 444 174" />
              <path d="M384 238 C 394 212 406 184 416 164" />
            </g>
            <!-- 腰口皮扣 -->

  </div>

  <script>
    // 节奏切换：只改根元素的 data-tempo，由 CSS 变量统一驱动全部动画时长，
    // 避免用 JS 去逐个修改动画属性造成状态分散、难维护。
    (function () {
      var root = document.documentElement;
      var buttons = Array.prototype.slice.call(document.querySelectorAll('.controls button'));

      root.setAttribute('data-tempo', 'normal');

      buttons.forEach(function (btn) {
        btn.addEventListener('click', function () {
          var tempo = btn.getAttribute('data-tempo');
          root.setAttribute('data-tempo', tempo);
          buttons.forEach(function (other) {
            other.setAttribute('aria-pressed', String(other === btn));
          });
        });
      });
    })();
  </script>
